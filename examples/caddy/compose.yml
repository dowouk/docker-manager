# Docker Manager – server behind Caddy
#
# Put this file at /docker/docker-manager/compose.yml, with a filled-in
# .env next to it (copy examples/.env.example), then run: docker compose up -d
#
# Do not set `hostname:` – the dashboard uses the container ID that Docker puts
# in HOSTNAME to recognise itself (for its own update button).
# There is no `ports:` section on purpose: the dashboard is only reachable
# through the reverse proxy, which is what makes trusting its
# X-Forwarded-* headers safe.
#
# Also add the snippet in Caddyfile (next to this file) to your Caddy config.
#
# If this server also runs Mailcow, uncomment the three lines marked [Mailcow]
# (and set MAILCOW_DIR if Mailcow isn't in /opt/mailcow-dockerized). They let
# the dashboard run Mailcow's own update.sh directly on the server, exactly as
# if you had logged in as root and run it by hand. That is a lot of power – but
# the Docker socket mounted below already gives root-level control of the
# server, so these options remove friction rather than adding a new kind of
# risk. The protection is the Entra sign-in (see Security in the README).

services:
  docker-manager:
    image: ghcr.io/dowouk/docker-manager:latest
    container_name: docker-manager
    restart: unless-stopped
    # Mailcow only: see the host processes and run update.sh on the server itself.
    # [Mailcow] pid: host
    # [Mailcow] privileged: true
    environment:
      # ---- Address ---------------------------------------------------------
      # The address you open in the browser. Microsoft sign-in needs it (the
      # redirect URI is https://<this host>/auth/callback); you can also set it
      # on the Settings page instead.
      PUBLIC_URL: "https://updates.example.com"

      # ---- Microsoft sign-in (optional – or set it on the Settings page) --
      # Local accounts work without these. The secret comes from the .env file
      # next to this one (see ../.env.example). Anything set here shows as locked
      # on the Settings page.
      # AZURE_TENANT_ID: "${AZURE_TENANT_ID}"
      # AZURE_CLIENT_ID: "${AZURE_CLIENT_ID}"
      # AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET}"

      # ---- Weekly email (optional – or set these on the Settings page) ----
      # Anything set here wins over the Settings page and shows as locked there.
      # ACS_CONNECTION_STRING: "${ACS_CONNECTION_STRING}"   # keep the value in .env
      # DIGEST_FROM: "${DIGEST_FROM}"
      # DIGEST_TO: "${DIGEST_TO}"
      # DIGEST_SCHEDULE: "0 8 * * MON"   # minute hour day month weekday (MON, MON-FRI, SAT,SUN)
      # DIGEST_WHEN_NONE: "true"         # also email when everything is up to date

      # ---- Other optional settings (defaults shown) -----------------------
      # Most of these can also be set on the Settings page; anything set here
      # wins and shows as locked there.
      # SERVER_NAME: "server1"   # shown in the page header and the email
      # CHECK_INTERVAL_HOURS: "6"
      # COMPOSE_ROOT: "/docker"
      # TZ: "Europe/London"
      # MAILCOW_DIR: "/opt/mailcow-dockerized"   # where Mailcow is installed
    volumes:
      # Lets the dashboard see and update containers. This is root-level
      # access to the server – the Entra sign-in is what protects it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Your compose projects, mounted at the SAME path as on the server.
      - /docker:/docker
      # The dashboard's own database and compose-file backups, kept in a
      # `data` folder next to this file so everything is in one place.
      - ./data:/data
      # Mailcow only: the Mailcow folder, at the same path as on the server.
      # [Mailcow] - /opt/mailcow-dockerized:/opt/mailcow-dockerized
    networks:
      - proxy

networks:
  # The Docker network your reverse proxy is on. Change `proxy` to its real
  # name (`docker network ls` lists them). It must already exist.
  proxy:
    external: true
