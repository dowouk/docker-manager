# Managed by dowouk/.github – edit there, not here. Delete this line to manage it locally.
# Weekly dependency report, synced to every repo from dowouk/.github
# (workflows/). Dependabot opens grouped version-update PRs (see the repo's
# generated .github/dependabot.yml) and the composer-development and
# pip-development groups merge themselves. This workflow keeps one issue
# listing what still needs a person: security and major PRs, production, npm
# and Actions PRs, auto-merges stuck for more than two days, and anything
# outdated that no open Dependabot PR covers (the direct Composer, npm and
# Python dependencies, and the SHA-pinned GitHub Actions, with a newer
# release). The body is rewritten each week, so it is always the current
# list, and the issue closes itself once nothing needs a person.
#
# Each ecosystem runs only when its lock file (for Python, pyproject.toml or
# requirements*.txt) exists, so the same file works in a repo with any mix of them or none.

name: Dependency updates

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "lts/*"
  PYTHON_VERSION: "3.x"
  ISSUE_TITLE: "Dependency updates available"
  # The organisation's issue type. It can only be set once the issue exists,
  # so it is a second call after `gh issue create`; a failure there warns
  # rather than losing the issue.
  ISSUE_TYPE: Task

jobs:
  outdated:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        if: hashFiles('composer.lock') != ''
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer
          coverage: none

      # Scripts stay off – nothing here needs to build or boot the app. A repo
      # can define a `deps` script (composer outdated with --ignore for
      # packages it holds back on purpose); it is used in place of plain
      # composer outdated, with these options passed through after `--`.
      - name: List outdated Composer dependencies
        if: hashFiles('composer.lock') != ''
        shell: bash
        run: |
          composer install --no-interaction --prefer-dist --no-scripts --no-progress
          if jq -e '.scripts.deps' composer.json > /dev/null; then
            outdated=(composer deps --no-interaction --)
          else
            outdated=(composer outdated --no-interaction)
          fi
          "${outdated[@]}" --direct --format=json \
            | jq -r '.installed // [] | .[] | "- [ ] `\(.name)` \(.version) → \(.latest)"' \
            > "$RUNNER_TEMP/php.md"

      - name: Set up Node
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: List outdated npm dependencies
        if: hashFiles('package-lock.json') != ''
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # npm outdated exits 1 whenever anything is outdated.
          { npm outdated --json || true; } \
            | jq -r 'to_entries[] | "- [ ] `\(.key)` \(.value.current) → \(.value.latest)"' \
            > "$RUNNER_TEMP/npm.md"

      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # There is no lock file to install from, so each pin in [project]
      # dependencies and optional-dependencies, and in requirements*.txt at the
      # repo root, is checked against the latest release on PyPI: a pin such as
      # fastapi==0.143.* is outdated once a release falls outside it. A
      # pyproject.toml with no [project] table (tool settings only) lists
      # nothing, and unpinned packages, -r/-e/-- lines and URLs are skipped.
      - name: List outdated Python dependencies
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        shell: bash
        run: |
          pip install --quiet --disable-pip-version-check packaging
          python - > "$RUNNER_TEMP/python.md" <<'EOF'
          import glob, json, os, tomllib, urllib.request
          from packaging.requirements import InvalidRequirement, Requirement
          from packaging.version import Version

          specs = []
          if os.path.exists("pyproject.toml"):
              project = tomllib.load(open("pyproject.toml", "rb")).get("project", {})
              specs += project.get("dependencies", [])
              for group in project.get("optional-dependencies", {}).values():
                  specs += group
          for path in sorted(glob.glob("requirements*.txt")):
              for line in open(path):
                  line = line.split(" #")[0].strip()
                  if line and not line.startswith(("#", "-")):
                      specs.append(line)

          seen = set()
          for spec in specs:
              try:
                  req = Requirement(spec)
              except InvalidRequirement:
                  continue
              if not req.specifier or req.name in seen:
                  continue
              seen.add(req.name)
              try:
                  with urllib.request.urlopen(f"https://pypi.org/pypi/{req.name}/json") as r:
                      latest = json.load(r)["info"]["version"]
              except Exception:
                  continue
              if not req.specifier.contains(Version(latest), prereleases=True):
                  print(f"- [ ] `{req.name}` {req.specifier} → {latest}")
          EOF

      # Compare each SHA pin's version comment with the action's latest
      # release, and give the new release's SHA so both can be updated
      # together. Sub-path actions (owner/repo/path) share the repository's
      # releases. Actions pinned by tag (@v4) or with no GitHub release are
      # skipped rather than failing the run.
      - name: List outdated GitHub Actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dowouk/.github keeps the synced workflows in workflows/ as well as
          # its own in .github/workflows/, so scan both when they exist. A file
          # in .github/workflows that carries the managed marker is a synced
          # copy: its pins can only be bumped centrally, so it is skipped.
          shopt -s nullglob
          marker='# Managed by dowouk/.github – edit there, not here. Delete this line to manage it locally.'
          files=()
          for f in .github/workflows/*.y*ml workflows/*.y*ml; do
            [[ "$f" == .github/workflows/* && "$(head -n 1 "$f")" == "$marker" ]] && continue
            files+=("$f")
          done
          # A repo with no SHA pins matches nothing; that is not a failure.
          { { (( ${#files[@]} )) && grep -hoE 'uses: [^ ]+@[0-9a-f]{40} # [^ ]+' "${files[@]}"; } || true; } | sort -u \
            | while read -r _ ref _ pinned; do
                # actions/cache/restore is released from actions/cache.
                repo=$(cut -d/ -f1-2 <<< "${ref%@*}")
                latest=$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null) || continue
                [[ "${latest#v}" == "${pinned#v}" ]] && continue
                sha=$(gh api "repos/$repo/commits/$latest" --jq .sha)
                echo "- [ ] \`$repo\` $pinned → $latest (\`$sha\`)"
              done > "$RUNNER_TEMP/actions.md"

      # No fallback: a failed listing must fail the job, as an empty list
      # would wrongly close the issue.
      - name: List open Dependabot PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --author app/dependabot --state open --limit 100 \
            --json number,title,url,createdAt,labels,headRefName,commits \
            > "$RUNNER_TEMP/prs.json"

      # Best-effort: the alerts endpoint may refuse the workflow token, and
      # a repo can have alerts switched off. Any failure leaves an empty list;
      # PRs are still flagged by their `security` label. Only runtime
      # dependencies count, so a development alert cannot mark a PR security.
      - name: List Dependabot alerts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          alerts=$(gh api "repos/$GH_REPO/dependabot/alerts?state=open" --paginate \
            --jq '[.[] | select(.dependency.scope == "runtime") | .dependency.package.name]' 2> /dev/null) || alerts=""
          # --paginate prints one array per page; join them into one.
          jq -s 'add // []' <<< "$alerts" > "$RUNNER_TEMP/alerts.json" 2> /dev/null \
            || echo '[]' > "$RUNNER_TEMP/alerts.json"

      # The only step with logic. Standard library only, and it never calls
      # gh, so it can be tested with fixture files. It writes an empty body.md
      # when nothing needs a person.
      - name: Build the issue body
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          from datetime import datetime, timedelta, timezone

          temp = os.environ["RUNNER_TEMP"]
          run_url = os.environ.get("RUN_URL", "")
          now = (
              datetime.fromisoformat(os.environ["NOW"].replace("Z", "+00:00"))
              if os.environ.get("NOW")
              else datetime.now(timezone.utc)
          )
          AUTO_MERGE_GROUPS = {"composer-development", "pip-development"}
          STUCK_AFTER = timedelta(hours=48)

          def read(name):
              try:
                  with open(os.path.join(temp, name)) as f:
                      return f.read()
              except OSError:
                  return ""

          def read_json(name):
              try:
                  return json.loads(read(name))
              except ValueError:
                  return []

          def norm(name):
              # Package names compare case-insensitively, with - _ . alike (PyPI).
              return re.sub(r"[-_.]+", "-", name.lower())

          prs = read_json("prs.json")
          alerts = {norm(n) for n in read_json("alerts.json")}

          # PR metadata: the group comes from the title ("Bump the X group", or
          # "... in the X group" for a single update), dependency names and
          # update types from the commit messages that Dependabot writes
          # ("dependency-name: X", "update-type: Y"). A PR without them has no
          # group and no dependencies, and is treated as a single update that
          # needs a person.
          def parse(pr):
              messages = "\n".join(
                  (c.get("messageHeadline") or "") + "\n" + (c.get("messageBody") or "")
                  for c in pr.get("commits") or []
              )
              group = re.search(r"\bthe (\S+) group\b", pr.get("title", ""), re.I)
              return {
                  "group": group.group(1) if group else None,
                  "deps": {norm(d) for d in re.findall(r"dependency-name: (\S+)", messages)},
                  "types": re.findall(r"update-type: (\S+)", messages),
              }

          sections = {k: [] for k in ("security", "major", "production", "stuck")}
          covered = set()
          for pr in prs:
              meta = parse(pr)
              covered |= meta["deps"]
              # The title goes in a code span so @mentions and ] cannot break out.
              title = pr["title"].replace("`", "")
              link = f"[#{pr['number']} `{title}`]({pr['url']})"
              labels = {l["name"] for l in pr.get("labels") or []}
              if "security" in labels or meta["deps"] & alerts:
                  sections["security"].append(f"- [ ] {link} – security")
              elif "version-update:semver-major" in meta["types"]:
                  sections["major"].append(f"- [ ] {link} – major")
              elif meta["group"] in AUTO_MERGE_GROUPS:
                  created = datetime.fromisoformat(pr["createdAt"].replace("Z", "+00:00"))
                  if now - created > STUCK_AFTER:
                      sections["stuck"].append(f"- [ ] {link}")
              else:
                  sections["production"].append(f"- [ ] {link}")

          # Outdated lines look like "- [ ] `name` old → new"; keep those whose
          # name no open Dependabot PR mentions.
          outdated = []
          for name in ("php", "npm", "python", "actions"):
              for line in read(name + ".md").splitlines():
                  m = re.search(r"`([^`]+)`", line)
                  if line.strip() and not (m and norm(m.group(1)) in covered):
                      outdated.append(line)

          titles = [
              ("security", "Security"),
              ("major", "Major upgrades"),
              ("production", "Production, npm and Actions updates"),
              ("stuck", "Stuck auto-merges"),
          ]
          out = []
          for key, title in titles:
              if sections[key]:
                  out += [f"### {title}", "", *sections[key], ""]
          if outdated:
              out += ["### Outdated with no open PR", "", *outdated, ""]
              if any("(`" in line for line in outdated):
                  out += ["Actions are pinned by SHA with a version comment – update both, in every workflow that uses the action.", ""]

          body = ""
          if out:
              body = (
                  f"Dependabot PRs that need a person, and anything outdated that no PR covers, as of {run_url}.\n\n"
                  + "\n".join(out)
              )
          with open(os.path.join(temp, "body.md"), "w") as f:
              f.write(body)
          EOF

      - name: Report to the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")

          if [[ ! -s "$RUNNER_TEMP/body.md" ]]; then
            echo "Nothing needs a person." >> "$GITHUB_STEP_SUMMARY"
            if [[ -n "$existing" ]]; then
              gh issue close "$existing" --comment "Nothing needs a person as of $RUN_URL – closing."
            fi
            exit 0
          fi

          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            url=$(gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/body.md" \
              --label dependencies,automated)
            gh api -X PATCH "repos/$GH_REPO/issues/${url##*/}" -f type="$ISSUE_TYPE" --silent \
              || echo "::warning::Could not set the $ISSUE_TYPE issue type on $url"
          fi
