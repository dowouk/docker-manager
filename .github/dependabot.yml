# Managed by dowouk/.github – edit there, not here. Delete this line to manage it locally.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    labels: [dependencies, automated]
    groups:
      pip-production:
        dependency-type: production
        update-types: [minor, patch]
      pip-development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    labels: [dependencies, automated]
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    exclude-paths:
      - .github/workflows/dependabot-auto-merge.yml
      - .github/workflows/dependency-updates.yml
      - .github/workflows/unreleased-changes.yml
      - .github/workflows/update-uri.yml
