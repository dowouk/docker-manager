{# Filled in by initConfirm (app.js) from the data-confirm attributes of the form being sent. #}
<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2>
  <p id="confirm-detail" class="card-text"></p>
  <form method="dialog" class="dialog-actions">
    <button type="submit" value="cancel" class="button button-quiet">Cancel</button>
    <button type="submit" value="confirm" id="confirm-button" class="button button-danger"></button>
  </form>
</dialog>
