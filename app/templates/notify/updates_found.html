{% extends "notify/_base.html" %}
{% block headline %}{{ headline }}{% endblock %}
{% block body %}
<table role="presentation" cellpadding="6" cellspacing="0" width="100%" style="border-collapse:collapse;font-size:14px;margin-top:12px;">
{% for u in updates %}
<tr style="border-top:1px solid #e4e7eb;">
<td style="vertical-align:top;font-weight:bold;">{{ u.name }}</td>
<td style="vertical-align:top;color:#5f6b7a;">{{ u.image }}</td>
<td style="vertical-align:top;">{{ u.change }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
