<!doctype html>
<html lang="en-GB">
<body style="margin:0;padding:16px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<div style="max-width:640px;margin:0 auto;background:#ffffff;padding:20px;border:1px solid #dde1e6;">
<h1 style="font-size:20px;margin:0 0 4px;">{{ server_name }}: {% block headline %}{% endblock %}</h1>
{% block body %}{% endblock %}
{% if link %}
<p style="margin:24px 0 0;font-size:13px;"><a href="{{ link }}" style="color:#1d4ed8;">{{ link_text }}</a></p>
{% endif %}
</div>
</body>
</html>
