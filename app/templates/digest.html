<!doctype html>
<html lang="en-GB">
<body style="margin:0;padding:16px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<div style="max-width:640px;margin:0 auto;background:#ffffff;padding:20px;border:1px solid #dde1e6;">
<h1 style="font-size:20px;margin:0 0 4px;">{{ server_name }}: {{ headline }}</h1>
<p style="margin:0 0 16px;color:#5f6b7a;font-size:13px;">Last checked {{ checked_at }}</p>
{% for section in sections %}
<h2 style="font-size:16px;margin:20px 0 6px;">{{ section.heading }}</h2>
<table role="presentation" cellpadding="6" cellspacing="0" width="100%" style="border-collapse:collapse;font-size:14px;">
{% for row in section.rows %}
<tr style="border-top:1px solid #e4e7eb;">
<td style="vertical-align:top;font-weight:bold;">{{ row.name }}</td>
<td style="vertical-align:top;color:#5f6b7a;">{{ row.image }}</td>
<td style="vertical-align:top;">{{ row.change }}</td>
</tr>
{% endfor %}
</table>
{% endfor %}
{% if public_url %}
<p style="margin:24px 0 0;font-size:13px;"><a href="{{ public_url }}" style="color:#1d4ed8;">Open the dashboard</a></p>
{% endif %}
</div>
</body>
</html>
