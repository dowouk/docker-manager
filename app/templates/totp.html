{% extends "base_public.html" %}
{% block title %}Two-step sign-in{% endblock %}
{% block content %}
<h1 class="auth-title">Two-step sign-in</h1>
<p class="lede">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
{% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/auth/totp" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="field">
    <label for="code">Code</label>
    <input class="input" id="code" name="code" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" autofocus required>
  </div>
  <button type="submit" class="button button-accent button-block">Continue</button>
</form>
<p class="footnote"><a href="/auth/login">Start again</a></p>
{% endblock %}
