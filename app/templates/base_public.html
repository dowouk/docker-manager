<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Sign in{% endblock %} – {{ server_name }}</title>
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preload" href="/static/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.ico" sizes="16x16 32x32">
  <link rel="icon" href="/static/icon-512.png" type="image/png" sizes="512x512">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
      </span>
      <span class="brand-name">{{ server_name }}</span>
    </div>
    <section class="card auth-card">
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
