[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-manager"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.*",
    "uvicorn[standard]==0.54.*",
    "jinja2==3.1.*",
    "httpx==0.28.*",
    "authlib==1.9.*",
    "joserfc==1.7.*",
    "docker==7.2.*",
    "apscheduler==3.11.*",
    "azure-communication-email==1.1.*",
    "pydantic-settings==2.16.*",
    "python-multipart==0.0.*",
    "cryptography==50.*",
    "argon2-cffi==25.*",
    "pyotp==2.*",
    "segno==1.*",
    "regex==2026.*",
]

[project.scripts]
docker-credential-docker-manager = "app.credhelper:main_cli"
docker-manager = "app.cli:main"

[project.urls]
Repository = "https://github.com/dowouk/docker-manager"

[project.optional-dependencies]
dev = [
    "pytest==9.1.*",
    "pytest-asyncio==1.4.*",
    "respx==0.23.*",
    "pyyaml==6.0.*",  # tests parse the example compose files
]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*", "templates/notify/*", "static/*", "data/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["fresh_install: leave the database as a brand-new install (first-start setup open)"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The httpx module is deprecated; please use httpx2 instead.:authlib.deprecate.AuthlibDeprecationWarning",
]
